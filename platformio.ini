; Chrono Node - PlatformIO configuration
; Target: ESP32-2432S028R ("Cheap Yellow Display", CYD)
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      serial console (115200 baud)

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder
; 921600 is unreliable with the CYD's CH340 USB-UART on macOS
upload_speed = 460800

; Two 1.75 MB OTA app slots + 384 KB LittleFS (see partitions/)
board_build.partitions = partitions/chrono_node_4mb.csv
board_build.filesystem = littlefs

; Names artifacts chrono-node-fw.* and embeds the git revision
extra_scripts = pre:scripts/build_info.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/RTClib@^2.1.4
    tzapu/WiFiManager@^2.0.17

build_flags =
    -Wall
    ; ---- TFT_eSPI configuration for the CYD (ILI9341, HSPI) ----
    ; Defined here so no files inside the global PlatformIO package dir need editing.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    ; CYD touch (XPT2046) is on its own SPI bus and handled separately
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; Some CYD variants (e.g. the dual-USB "CYD2USB") use an ST7789 panel instead.
    ; If colours are inverted or the image is garbled, replace ILI9341_2_DRIVER with:
    ;   -DST7789_DRIVER=1
    ;   -DTFT_INVERSION_ON=1
