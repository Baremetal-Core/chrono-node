; Chrono Node - PlatformIO configuration
; Target: ESP32-2432S028R ("Cheap Yellow Display", CYD)
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      serial console (115200 baud)

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder
; 921600 is unreliable with the CYD's CH340 USB-UART on macOS
upload_speed = 460800

; Two 1.75 MB OTA app slots + 384 KB LittleFS (see partitions/)
board_build.partitions = partitions/chrono_node_4mb.csv
board_build.filesystem = littlefs

; Names artifacts chrono-node-fw.* and embeds the git revision
extra_scripts = pre:scripts/build_info.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/RTClib@^2.1.4
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    ; ---- TFT_eSPI configuration for the CYD (ILI9341, HSPI) ----
    ; Defined here so no files inside the global PlatformIO package dir need editing.
    -DUSER_SETUP_LOADED=1
    ; This CYD batch has an ST7789 IPS panel (as on the dual-USB "CYD2USB")
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    ; Screen readback (SHOT) is bit-shifted at 20 MHz on the CYD
    -DSPI_READ_FREQUENCY=6000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    ; CYD touch (XPT2046) is on its own SPI bus and handled separately
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; Panel variants differ between CYD batches. Run TEST on the serial console.
    ; Original single-USB CYD (ILI9341, TN panel): replace the three ST7789 lines with
    ;   -DILI9341_2_DRIVER=1
    ; Then, if needed:
    ; - background white instead of black -> toggle TFT_INVERSION_ON / TFT_INVERSION_OFF
    ; - RED bar shows blue                -> toggle TFT_RGB_ORDER=TFT_BGR / TFT_RGB
    ; An ILI9341 driver on an ST7789 panel shows correct but washed-out colours
    ; (wrong gamma tables), even with inversion fixed.
