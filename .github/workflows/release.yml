name: Release

# Push a tag like v0.10.0 (matching kFirmwareVersion in include/config.h) to
# build and publish a GitHub release with:
#   chrono-node-fw.bin       OTA image, for the web page's Firmware section
#   chrono-node-fw-full.bin  complete flash image, write with esptool at 0x0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag matches the firmware version
        run: |
          version=$(sed -n 's/.*kFirmwareVersion = "\(.*\)";/\1/p' include/config.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match kFirmwareVersion $version"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Build
        run: pio run

      - name: Package
        run: |
          mkdir -p dist
          b=.pio/build/cyd
          cp "$b/chrono-node-fw.bin" dist/
          python -m esptool --chip esp32 merge_bin -o dist/chrono-node-fw-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$b/bootloader.bin" 0x8000 "$b/partitions.bin" \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$b/chrono-node-fw.bin"
          (cd dist && sha256sum *.bin > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Chrono Node $GITHUB_REF_NAME"
